<meta charset="UTF-8">

<title>COSMO V12</title>
<style>
:root{--g:#0f0;--d:#060;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#050505;color:var(--g);
font-family:Consolas,monospace;overflow:hidden;
height:100vh;display:flex;flex-direction:column;}
header{height:52px;display:flex;align-items:center;
justify-content:space-between;padding:0 8px;
border-bottom:1px solid var(--d);background:#001100;
flex-shrink:0;z-index:50;}
.hleft{display:flex;align-items:center;gap:6px;}
.logo{font-weight:bold;font-size:13px;
text-shadow:0 0 5px var(--g);}
.menu{background:transparent;border:1px solid var(--d);
color:var(--g);font-size:16px;line-height:1;
padding:6px 10px;cursor:pointer;font-family:inherit;}
.tabs{display:flex;gap:8px;}
.btn{min-width:90px;padding:12px 8px;background:transparent;
border:1px solid var(--d);color:var(--d);
font-family:inherit;font-size:14px;cursor:pointer;}
.btn.active{background:var(--g);color:#000;
border-color:var(--g);box-shadow:0 0 8px var(--g);}
#menu-panel{position:fixed;top:56px;left:8px;z-index:200;
display:none;background:#000;border:1px solid var(--g);
padding:8px;max-width:70vw;}
#menu-panel.show{display:block;}
.mi{display:block;width:100%;text-align:left;
background:transparent;border:none;
border-bottom:1px dashed #030;color:var(--g);
font-family:inherit;font-size:13px;padding:8px 6px;
cursor:pointer;}
.mi:last-child{border-bottom:none;}
#info-panel{position:fixed;top:60px;left:8px;right:8px;
max-height:70vh;z-index:300;display:none;background:#000;
border:1px solid var(--g);padding:10px;overflow-y:auto;
-webkit-overflow-scrolling:touch;}
#info-panel.show{display:block;}
#info-close{margin-top:8px;background:transparent;
border:1px solid var(--g);color:var(--g);
font-family:inherit;padding:8px 14px;cursor:pointer;}
main{flex:1;position:relative;overflow:hidden;}
.view{position:absolute;top:0;left:0;width:100%;
height:100%;display:none;flex-direction:column;}
.view.active{display:flex;}
#out{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
touch-action:pan-y;padding:10px;font-size:13px;
line-height:1.4;word-break:break-word;}
#in-wrap{display:flex;align-items:center;padding:8px 10px;
border-top:1px solid var(--d);background:#000;flex-shrink:0;}
#prompt{color:var(--g);margin-right:8px;font-weight:bold;}
#cmd{flex:1;background:transparent;border:none;outline:none;
color:#fff;font-family:inherit;font-size:16px;}
#b-send{background:transparent;border:1px solid var(--d);
color:var(--g);font-size:16px;padding:6px 12px;
cursor:pointer;font-family:inherit;}
canvas{width:100%;height:100%;display:block;
touch-action:none;}
#legend{position:absolute;bottom:8px;left:8px;
border:1px solid var(--d);background:rgba(0,0,0,.8);
padding:6px;font-size:10px;pointer-events:none;}
#tag{position:absolute;display:none;background:#000;
border:1px solid var(--g);padding:3px 6px;font-size:11px;
color:var(--g);z-index:5;}
#tag-dot{background:transparent;border:none;color:var(--g);
font-size:14px;padding:0 4px;cursor:pointer;
font-family:inherit;}
.l-info{color:#888;}
.l-ok{color:#0f0;}
.l-err{color:#f33;}
.l-data{color:#0cf;}
.l-cmd{color:#fff;}

<script>
window.onerror=function(m,s,l){
var o=document.getElementById('out');
if(o){
var d=document.createElement('div');
d.style.color='#f33';
d.textContent='JS ERROR: '+m+' line '+l;
o.appendChild(d);
}
return false;
};
function $(id){ return document.getElementById(id); }
var out=$('out'), inp=$('cmd');
var atBottom=true;
out.addEventListener('scroll',function(){
atBottom=(out.scrollTop+out.clientHeight)>=
(out.scrollHeight-24);
});
function log(t,c){
var d=document.createElement('div');
d.className='l-'+(c||'info');
d.textContent=t;
out.appendChild(d);
if(atBottom) out.scrollTop=out.scrollHeight;
while(out.children.length>120){
out.removeChild(out.firstChild);
}
}
function fit(){
var h=window.innerHeight;
try{
if(window.visualViewport){
h=window.visualViewport.height;
}
}catch(e){}
document.body.style.height=h+'px';
window.scrollTo(0,0);
}
if(window.visualViewport){
visualViewport.addEventListener('resize',fit);
}
window.addEventListener('resize',fit);
fit();
function exec(raw){
if(typeof run==='function') run(raw);
else log('ENGINE MISSING: '+raw,'err');
}
$('b-send').addEventListener('click',function(){
exec(inp.value); inp.value=''; inp.focus();
});
inp.addEventListener('keydown',function(e){
if(e.key==='Enter'){ exec(inp.value); inp.value=''; }
});
$('in-wrap').addEventListener('click',function(){
inp.focus();
});
function switchTab(t){
var vt=$('v-term'), vg=$('v-globe');
var bt=$('b-term'), bg=$('b-globe');
if(t==='term'){
vt.classList.add('active');
vg.classList.remove('active');
bt.classList.add('active');
bg.classList.remove('active');
setTimeout(fit,50);
}else{
if(typeof initMap!=='function'){
log('MAP BLOCK MISSING','err'); return;
}
if(!initMap()){
log('Map unavailable','err'); return;
}
vg.classList.add('active');
vt.classList.remove('active');
bg.classList.add('active');
bt.classList.remove('active');
setTimeout(fit,50);
}
}
$('b-term').addEventListener('click',function(){
switchTab('term');
});
$('b-globe').addEventListener('click',function(){
switchTab('globe');
});
$('menu-btn').addEventListener('click',function(e){
e.stopPropagation();
$('menu-panel').classList.toggle('show');
});
document.addEventListener('click',function(e){
var id=e.target.id;
if(id!=='menu-btn'&&id!=='menu-panel'){
$('menu-panel').classList.remove('show');
}
});
var mis=document.querySelectorAll('.mi');
Array.prototype.forEach.call(mis,function(b){
b.addEventListener('click',function(e){
e.stopPropagation();
$('menu-panel').classList.remove('show');
exec(b.getAttribute('data-c'));
});
});
$('info-close').addEventListener('click',function(){
$('info-panel').classList.remove('show');
});
$('tag-dot').addEventListener('click',function(e){
e.stopPropagation();
if(typeof openInfo==='function'&&
typeof lastTap!=='undefined'&&lastTap){
openInfo(lastTap);
}
});
log('CORE A OK','ok');
</script>

<script>
var state={stream:false,track:null,mode:null};
var lastTap=null;
var issLive=null;
var netState=0;
function pollISS(){
var u='https://api.wheretheiss.at/v1/satellites/25544';
fetch(u).then(function(r){ return r.json(); })
.then(function(d){
issLive={lat:d.latitude,lon:d.longitude,
alt:d.altitude};
if(netState!==1){
netState=1;
log('NET OK: ISS live telemetry','ok');
}
}).catch(function(){
if(netState!==2){
netState=2;
log('NET FAIL: offline model mode','info');
}
});
}
pollISS();
setInterval(pollISS,5000);
function orbitA(s){
var T=1440/s.mm;
var sec=T*60/(2*Math.PI);
return Math.pow(398600.4418*sec*sec,1/3);
}
function modelPos(s,date){
var T=1440/s.mm;
var t=date.getTime()/60000;
var u=2*Math.PI*((t%T)/T)+s.ph;
var i=s.incl*Math.PI/180;
var su=Math.sin(u), cu=Math.cos(u);
var lat=Math.asin(Math.sin(i)*su)*180/Math.PI;
var lon=Math.atan2(Math.cos(i)*su,cu)*180/Math.PI;
lon=lon+s.raan-0.250684*t;
lon=((lon+180)%360+360)%360-180;
var a=orbitA(s);
return {lat:lat,lon:lon,
alt:a*(1+s.e*Math.cos(u))-6371};
}
function getPos(s,date){
if(s.id==='25544'&&issLive) return issLive;
if(s.sp){
return {lat:s.sp.lat,lon:s.sp.lon,alt:0,ds:true};
}
return modelPos(s,date);
}
function orbitParams(s){
var a=orbitA(s);
return {apo:a*(1+s.e)-6371,peri:a*(1-s.e)-6371,
period:1440/s.mm,inc:s.incl};
}
var WIKI_URL='https://ru.wikipedia.org/w/api.php?'+
'action=query&generator=search&gsrlimit=1'+
'&prop=extracts&exintro=1&explaintext=1'+
'&format=json&origin=*&gsrsearch=';
function fetchWiki(name,box){
fetch(WIKI_URL+encodeURIComponent(name))
.then(function(r){ return r.json(); })
.then(function(j){
var p=j&&j.query&&j.query.pages;
if(!p) throw 0;
var ex=p[Object.keys(p)[0]].extract||'';
box.textContent=ex?ex.slice(0,700)+'...':'WIKI: empty';
}).catch(function(){
box.textContent='WIKI: unavailable offline';
});
}
function openInfo(s){
lastTap=s;
var body=document.getElementById('info-body');
body.innerHTML='';
function add(t,c){
var d=document.createElement('div');
d.className='l-'+(c||'info');
d.textContent=t;
body.appendChild(d);
}
add(s.name+' ['+s.id+'] type:'+s.type,'ok');
var f=(typeof F!=='undefined')?
F[s.type==='SL'?'SL':s.id]:null;
if(f){
var q=f.split('|');
add('LAUNCH: '+q[0]);
add('OPERATOR: '+q[1]);
add('MASS: '+q[2]);
add('SIZE: '+q[3]);
add('MISSION: '+q[4]);
}else{
add('No reference data','err');
}
add('--- WIKIPEDIA ---','info');
var w=document.createElement('div');
w.className='l-info';
w.textContent='loading...';
body.appendChild(w);
fetchWiki(s.name,w);
document.getElementById('info-panel')
.classList.add('show');
}
function satInfo(s){
var pos=getPos(s,new Date());
var line='INFO: '+s.name+' ['+s.id+']';
if(s.sp) line+=' | DEEP SPACE / L2';
else if(pos&&isFinite(pos.lat)){
line+=' | LAT:'+pos.lat.toFixed(2)+
' LON:'+pos.lon.toFixed(2)+
' ALT:'+pos.alt.toFixed(0)+'km';
}else line+=' | NO DATA';
log(line,'data');
if(!s.sp){
var op=orbitParams(s);
log('  APO: '+op.apo.toFixed(0)+' km | PERI: '+
op.peri.toFixed(0)+' km | PERIOD: '+
op.period.toFixed(0)+' min | INC: '+
op.inc.toFixed(1)+' deg','info');
}
}
var TOP5=[];
function byName(n){
var r=null;
DB.forEach(function(s){
if(!r&&s.name.indexOf(n)===0) r=s;
});
return r;
}
var sl0=DB.filter(function(s){
return s.type==='SL'; })[0];
TOP5=[byName('ISS'),byName('TIANGONG'),
byName('HUBBLE'),sl0,byName('VOYAGER-1')]
.filter(Boolean);
function run(raw){
var p=raw.trim().toLowerCase().split(/\s+/);
var c=p[0], arg=p.slice(1).join(' ');
log('> '+raw,'cmd');
if(c==='help'){
log('COMMANDS:','ok');
log(' list | scan - all objects');
log(' find <name/id> | info <name>');
log(' track <name> - one sat');
log(' trackall - round-robin all sats');
log(' tracktop - top-5 popular');
log(' tracklast - last tapped sat');
log(' untrack | stream on|off');
log(' clear | about | globe | term');
}
else if(c==='about'){ log(ABOUT_TEXT,'ok'); }
else if(c==='list'||c==='scan'){
log('--- ASSETS: '+DB.length+' ---','info');
DB.forEach(function(s){
log('['+s.id+'] '+s.name,'data');
});
}
else if(c==='find'||c==='info'){
if(!arg){ log('Usage: '+c+' <name>','err'); return; }
var f=null;
DB.forEach(function(s){
if(!f&&(s.id===arg||
s.name.toLowerCase().indexOf(arg)!==-1)) f=s;
});
if(f){ lastTap=f; satInfo(f); }
else log('NOT FOUND: '+arg,'err');
}
else if(c==='track'){
var t=null;
DB.forEach(function(s){
if(!t&&s.name.toLowerCase().indexOf(arg)!==-1) t=s;
});
if(t){
state.track=t; state.mode=null;
log('TRACKING ONE: '+t.name,'ok');
}else log('Unknown','err');
}
else if(c==='trackall'){
state.track=null; state.mode='all';
log('TRACKING ALL: round-robin','ok');
}
else if(c==='tracktop'){
state.track=null; state.mode='top';
var tn=TOP5.map(function(s){ return s.name; })
.join(', ');
log('TRACKING TOP-5: '+tn,'ok');
}
else if(c==='tracklast'){
if(lastTap){
state.track=lastTap; state.mode=null;
log('TRACKING ONE: '+lastTap.name,'ok');
}else log('Tap a sat first','err');
}
else if(c==='untrack'){
state.track=null; state.mode=null;
log('Tracking stopped','info');
}
else if(c==='stream'){
if(arg==='on'){ state.stream=true;
log('Stream ON','ok'); }
else if(arg==='off'){ state.stream=false;
log('Stream OFF','info'); }
else log('Usage: stream on|off','err');
}
else if(c==='clear'){ out.innerHTML=''; }
else if(c==='globe'){ switchTab('globe'); }
else if(c==='term'){ switchTab('term'); }
else if(c){ log('Unknown: '+c,'err'); }
}
var rr=0, rrTop=0;
function satLine(s,now){
var p=getPos(s,now);
var head='['+now.toTimeString().split(' ')[0]+
'] '+s.name+' >> ';
if(p&&isFinite(p.lat)&&!p.ds){
return head+'LAT:'+p.lat.toFixed(2)+
' LON:'+p.lon.toFixed(2)+
' ALT:'+p.alt.toFixed(0)+'km';
}
if(p&&p.ds) return head+'DEEP SPACE';
return head+'NO DATA';
}
setInterval(function(){
var now=new Date();
if(state.track) log(satLine(state.track,now),'data');
else if(state.mode==='all'){
log(satLine(DB[rr%DB.length],now),'data'); rr++;
}
else if(state.mode==='top'){
log(satLine(TOP5[rrTop%TOP5.length],now),'data');
rrTop++;
}
else if(state.stream){
var r=DB[Math.floor(Math.random()*DB.length)];
log('SIG: '+r.name+' @ '+now.toTimeString()
.split(' ')[0],'info');
}
},1000);
var gCv=null,gCtx=null,gReady=false;
var yaw=0.6,pitch=0.35,zoom=1,gDrag=false;
var GRID=[],EQ=[];
function v3(lat,lon,r){
var la=lat*Math.PI/180, lo=lon*Math.PI/180;
return [r*Math.cos(la)*Math.cos(lo),
r*Math.sin(la),
r*Math.cos(la)*Math.sin(lo)];
}
function buildGrid(){
GRID.length=0; EQ.length=0;
var lat,lon;
for(lat=-60;lat<=60;lat+=30){
for(lon=-180;lon<180;lon+=6){
GRID.push([v3(lat,lon,1),v3(lat,lon+6,1)]);
}
}
for(lon=-180;lon<180;lon+=30){
for(lat=-90;lat<90;lat+=6){
GRID.push([v3(lat,lon,1),v3(lat+6,lon,1)]);
}
}
for(lon=-180;lon<180;lon+=4){
EQ.push([v3(0,lon,1.002),v3(0,lon+4,1.002)]);
}
}
function rot(v){
var cy=Math.cos(yaw), sy=Math.sin(yaw);
var cp=Math.cos(pitch), sp=Math.sin(pitch);
var x=v[0]*cy+v[2]*sy;
var z=-v[0]*sy+v[2]*cy;
var y2=v[1]*cp-z*sp;
var z2=v[1]*sp+z*cp;
return [x,y2,z2];
}
function proj(v){
var w=gCv.width,h=gCv.height;
var R=Math.min(w,h)*0.38*zoom;
var p=rot(v);
return {x:w/2+p[0]*R,y:h/2-p[1]*R,z:p[2]};
}
function drawGlobe(){
if(!gReady) return;
if(!gDrag) yaw+=0.0004;
var w=gCv.width,h=gCv.height;
gCtx.fillStyle='#050505';
gCtx.fillRect(0,0,w,h);
var R=Math.min(w,h)*0.38*zoom;
gCtx.strokeStyle='#003300';
gCtx.beginPath();
gCtx.arc(w/2,h/2,R,0,6.2832);
gCtx.stroke();
gCtx.strokeStyle='#005500';
gCtx.beginPath();
GRID.forEach(function(seg){
var a=proj(seg[0]), b=proj(seg[1]);
if(a.z>0&&b.z>0){
gCtx.moveTo(a.x,a.y);
gCtx.lineTo(b.x,b.y);
}
});
gCtx.stroke();
gCtx.strokeStyle='#00ff00';
gCtx.beginPath();
EQ.forEach(function(seg){
var a=proj(seg[0]), b=proj(seg[1]);
if(a.z>0&&b.z>0){
gCtx.moveTo(a.x,a.y);
gCtx.lineTo(b.x,b.y);
}
});
gCtx.stroke();
var now=new Date();
DB.forEach(function(s){
var p=getPos(s,now);
if(!p){ s._front=false; return; }
var r=1+Math.min(Math.max(p.alt,0),70000)/6371;
if(s.sp) r=2.1;
var q=proj(v3(p.lat,p.lon,r));
s._x=q.x; s._y=q.y; s._front=q.z>0;
if(q.z<=0) return;
gCtx.fillStyle='#'+
('000000'+s.col.toString(16)).slice(-6);
gCtx.beginPath();
gCtx.arc(q.x,q.y,3.5,0,6.2832);
gCtx.fill();
});
requestAnimationFrame(drawGlobe);
}
function gSize(){
var vg=document.getElementById('v-globe');
gCv.width=vg.clientWidth||window.innerWidth;
gCv.height=vg.clientHeight||
(window.innerHeight-52);
}
function tapGlobe(e){
var rect=gCv.getBoundingClientRect();
var x=e.clientX-rect.left, y=e.clientY-rect.top;
var best=null,bd=1e9;
DB.forEach(function(s){
if(!s._front||s._x===undefined) return;
var d=Math.sqrt((s._x-x)*(s._x-x)+
(s._y-y)*(s._y-y));
if(d<bd){ bd=d; best=s; }
});
if(best&&bd<35){
lastTap=best;
satInfo(best);
document.getElementById('tag-name')
.textContent=best.name;
var tg=document.getElementById('tag');
tg.style.left=(x+12)+'px';
tg.style.top=(y-10)+'px';
tg.style.display='block';
setTimeout(function(){
tg.style.display='none';
},4000);
}
}
function globeEvents(){
var pts={},md=false,mx=0,my=0,mt=0,moved=0;
var pinchD=0;
gCv.addEventListener('pointerdown',function(e){
pts[e.pointerId]={x:e.clientX,y:e.clientY};
var n=Object.keys(pts).length;
if(n===1){
md=true; gDrag=true;
mx=e.clientX; my=e.clientY;
mt=Date.now(); moved=0;
}else if(n===2){
var ks=Object.keys(pts);
pinchD=Math.hypot(ks[0],ks[1]);
pinchD=Math.hypot(
pts[ks[0]].x-pts[ks[1]].x,
pts[ks[0]].y-pts[ks[1]].y);
md=false;
}
try{ gCv.setPointerCapture(e.pointerId); }catch(e2){}
});
gCv.addEventListener('pointermove',function(e){
if(!pts[e.pointerId]) return;
var prev=pts[e.pointerId];
var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
pts[e.pointerId]={x:e.clientX,y:e.clientY};
var ks=Object.keys(pts);
if(ks.length===2){
var d=Math.hypot(
pts[ks[0]].x-pts[ks[1]].x,
pts[ks[0]].y-pts[ks[1]].y);
if(pinchD>0){
zoom*=d/pinchD;
zoom=Math.max(0.5,Math.min(4,zoom));
}
pinchD=d;
}else if(md){
yaw+=dx*0.005;
pitch+=dy*0.005;
pitch=Math.max(-1.5,Math.min(1.5,pitch));
moved+=Math.abs(dx)+Math.abs(dy);
}
});
function up(e){
delete pts[e.pointerId];
if(Object.keys(pts).length<2) pinchD=0;
if(Object.keys(pts).length===0){
gDrag=false;
if(md&&moved<10&&Date.now()-mt<500){
tapGlobe(e);
}
md=false;
}
}
gCv.addEventListener('pointerup',up);
gCv.addEventListener('pointercancel',up);
}
function initMap(){
if(gReady) return true;
gCv=document.getElementById('c2d');
if(!gCv) return false;
gCtx=gCv.getContext('2d');
buildGrid();
gReady=true;
gSize();
globeEvents();
requestAnimationFrame(drawGlobe);
return true;
}
window.addEventListener('resize',function(){
if(gReady) gSize();
});
log('ENG C OK + 3D CORE','ok');
</script>
</body>
